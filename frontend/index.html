<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>PeriodIQ</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/data.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <button class="topbar-action topbar-back" id="topbar-back" type="button" aria-label="返回" hidden>‹</button>
      <h1 class="topbar-title" id="topbar-title">今天</h1>
      <button class="avatar" id="avatar" type="button" aria-label="我的与设置">
        <img class="avatar-img" id="avatar-img" alt="" hidden>
        <span class="avatar-mark" id="avatar-mark">·</span>
      </button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <div class="bottom-scrim" aria-hidden="true"></div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="主导航">
      <div class="tab-items" id="tab-items"></div>
      <button class="fab" id="fab" type="button" aria-label="快捷记录">+</button>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <div id="dialog-root"></div>
  <script defer src="js/api.js"></script>
  <script defer src="js/copy.js"></script>
  <script defer src="js/art.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/router.js"></script>
  <script defer src="js/charts.js"></script>
  <script defer src="js/pages/login.js"></script>
  <script defer src="js/pages/today.js"></script>
  <script defer src="js/pages/calendar.js"></script>
  <script defer src="js/pages/record.js"></script>
  <script defer src="js/pages/history.js"></script>
  <script defer src="js/pages/analysis.js"></script>
  <script defer src="js/pages/profile.js"></script>
  <script defer src="js/pages/settings.js"></script>
  <script defer src="js/pages/data.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
